name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Find project (unzip if a .zip was uploaded)
        run: |
          ZIP=$(ls ./*.zip 2>/dev/null | head -1 || true)
          if [ -n "$ZIP" ]; then
            echo "Found zip: $ZIP"
            mkdir -p /tmp/proj && unzip -q "$ZIP" -d /tmp/proj
            PROJ=$(dirname "$(find /tmp/proj -name settings.gradle.kts | head -1)")
          else
            PROJ=$GITHUB_WORKSPACE
          fi
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"
          echo "Project dir: $PROJ"

      - name: Build release APK
        working-directory: ${{ env.PROJ }}
        run: chmod +x ./gradlew && ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PMS-CSS-Essay-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
